<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Single-viewport explorer of a unified network-M&S corpus: 344 entries across two research passes (general + MATLAB/Simulink), anchored on the 2015 Obaidat/Zarai/Nicopolitidis volume, seven relational models incl. a typed 12-kind reading graph and editorial didactic / theory→applied overlays.">
<title>Network M&amp;S Corpus Explorer — two passes, seven models, one viewport</title>
<!-- Baseline target: Widely available as of 2026-07. Raw HTML/CSS/JS, no framework, no build
     step at view time; opens directly from file:// (data ships as classic scripts because
     fetch() of JSON is blocked on file://). See ARCHITECTURE.md. -->
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/app.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="eyebrow">m&s of computer networks & systems · two research passes · typed reading graph → 12 relation kinds · collected 2026-07</div>
    <h1>Network M&amp;S Corpus Explorer</h1>
  </div>
  <nav class="tabs" role="tablist" id="tabs" aria-label="Relational models"></nav>
  <div class="controls" role="search">
    <input id="q" type="search" placeholder="search title / citation / id…  ( / )" aria-label="Search corpus">
    <select id="fver" aria-label="Verification filter">
      <option value="">verification: all</option>
      <option value="verified-web">verified[WEB] only</option>
      <option value="verified-train">verified[TRAIN] only</option>
      <option value="unverified">unverified only</option>
    </select>
    <select id="fcorpus" aria-label="Corpus filter">
      <option value="">corpus: both</option>
      <option value="gen">corpus: gen (networks/systems)</option>
      <option value="mat">corpus: mat (MATLAB/Simulink)</option>
    </select>
    <button id="reset" type="button" title="Clear filters and selection">reset</button>
  </div>
</header>

<main class="stage">
  <div id="view-root" tabindex="-1"></div>
  <aside id="inspector" class="inspector" aria-label="Inspector"></aside>
</main>

<noscript>
  <p style="padding:1.5rem">This explorer renders seven relational models with JavaScript. The
  underlying facts are in <a href="data/corpus.json">data/corpus.json</a> and
  <a href="data/relations.json">data/relations.json</a>; the build/verification log is
  <a href="data/corpus_report.md">data/corpus_report.md</a>.</p>
</noscript>

<!-- DATA (generated; classic scripts so the page opens from file://) -->
<script src="data/corpus.js"></script>
<script src="data/relations.js"></script>
<!-- LOGIC: seam + helpers + boundary + state -->
<script src="logic/log.js"></script>
<script src="logic/util.js"></script>
<script src="logic/parse.js"></script>
<script src="logic/state.js"></script>
<!-- LOGIC: functional core, then the shells -->
<script src="logic/core.js"></script>
<script src="logic/inspector.js"></script>
<script src="logic/views/anchor.js"></script>
<script src="logic/views/reading.js"></script>
<script src="logic/views/graph.js"></script>
<script src="logic/views/facets.js"></script>
<script src="logic/views/timeline.js"></script>
<script src="logic/views/matlab.js"></script>
<script src="logic/views/triage.js"></script>
<script src="logic/app.js"></script>
</body>
</html>
